name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet test .\tests\Ravenfield.AiTick.Tests\Ravenfield.AiTick.Tests.csproj --configuration Release
